   <g id="text_1">
    <text style="font-weight: 700; font-size: 20.16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="39.16665" transform="rotate(-0 38.16 39.16665)">PURI-Sign | Alur kerja sistem</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="75.8988" transform="rotate(-0 38.16 75.8988)">Host menyiapkan input; FPGA menyimpan kunci dan menghitung signature ECDSA P-256.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="1024.153088" transform="rotate(-0 38.16 1024.153088)">PURI-Sign | Berdasarkan RTL shared-engine, 8 Oktober 2026 | Diagram alur, bukan timing fisik</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243746" x="230.4" y="128.4588" transform="rotate(-0 230.4 128.4588)">Reset / awal penggunaan</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(190.6821 198.5931)">HOST → FPGA</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(129.7188 214.8588)">Tulis private key d: 8 word × 32 bit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(170.1927 285.1569)">CMD_PROVISION = 1</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(115.4727 302.6988)">Validasi key → hitung public key Q = dG</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(186.6024 372.9969)">CMD_LOCK = 2</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(139.2606 390.3786)">key_valid = 1 → key_locked = 1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(214.3593 459.2331)">HOST</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(112.1823 475.4988)">Hash dokumen → digest SHA-256 256 bit</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(190.6821 544.1931)">HOST → FPGA</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(149.7699 560.4588)">Tulis digest: 8 word × 32 bit</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(187.812 630.7569)">CMD_SIGN = 4</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(108.4194 648.1386)">Core memeriksa key_valid dan key_locked</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(164.5695 718.8588)">FPGA: jalankan signing</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(159.7626 737.2548)">RFC6979 → kG → r dan s</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(140.9445 806.6988)">HOST: tunggu transaksi selesai</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(115.3314 823.9788)">Periksa busy / done / error; baca r dan s</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(130.2795 894.5388)">Signature tersedia untuk dokumen</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(131.9058 912.9348)">Verifikasi dilakukan di luar core ini</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(544.311 281.0988)">Public key Q = (Qx, Qy) dapat dibaca</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(534.4344 298.2186)">CMD_GET_PUB = 3 memeriksa key_valid</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(559.6551 315.6588)">Detail provisioning: halaman 02</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(593.8164 456.9804)">BATAS HOST / CORE</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(524.9907 473.6988)">Core menerima digest, bukan file dokumen.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(542.2293 490.9788)">SHA-256 di jalur nonce dipakai HMAC.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(530.4096 508.2588)">Private key berasal dari provisioning host;</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(527.3973 525.5388)">tidak ada generator key acak pada alur ini.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(568.0269 623.5533)">LATENSI SIMULASI @ 25 MHz</text>
