   <g id="text_1">
    <text style="font-weight: 700; font-size: 20.16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="39.16665" transform="rotate(-0 38.16 39.16665)">Arsitektur | Dua controller, satu kelompok engine</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="75.8988" transform="rotate(-0 38.16 75.8988)">Pemilihan owner mengikuti FSM perintah core; provisioning dan signing tidak berjalan bersamaan.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="1016.953088" transform="rotate(-0 38.16 1016.953088)">PURI-Sign | Berdasarkan RTL shared-engine, 8 Oktober 2026 | Diagram alur, bukan timing fisik</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(321.8886 133.1388)">HOST / antarmuka register Avalon-MM</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(277.8327 150.4188)">CMD, STATUS, key input, digest, public key, signature</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(352.1196 244.5786)">tinysign_core: FSM perintah</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(237.4335 261.7569)">IDLE → PROVISION_WAIT / LOCK_WAIT / SIGN_WAIT / ZEROIZE_WAIT</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(177.147 362.2986)">key_manager</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(122.0328 379.7388)">Staging key → validasi → Q = dG</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(105.0561 397.0188)">Penyimpanan private key + public key</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(151.245 414.0369)">SHARED_ENGINES = 1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(610.4016 362.2986)">ecdsa_signer</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(537.2838 379.5786)">RFC6979 / HMAC-SHA-256 + mod_add</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(580.5144 397.5471)">Urutan ECDSA; hasil r,s</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(583.245 414.0369)">SHARED_ENGINES = 1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.08px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="386.64" y="369.51795" transform="rotate(-0 386.64 369.51795)">d internal</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(292.9068 552.8988)">Pemilih operand / start dan pemilah done / error</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(286.1865 570.0186)">provision_owner atau sign_owner berasal dari FSM</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(261.3321 587.4588)">Respons selesai/error hanya diteruskan kepada owner aktif</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(120.2526 729.1386)">1 × scalar_mult</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(133.0524 747.6948)">dG atau kG</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(113.9175 763.6986)">point_ops internal</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(395.5158 729.1386)">1 × mod_inv</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(357.1776 746.5788)">Z⁻¹ mod p atau k⁻¹ mod n</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(356.8743 764.9748)">Aritmetika internal sendiri</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(622.791 729.1386)">1 × mod_mul di level core</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(643.0212 747.6948)">Konversi affine dan</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(650.0547 763.8588)">perkalian ECDSA</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(361.1799 866.4021)">JUMLAH FISIK HIERARKIS</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(301.5396 883.6038)">Scalar engine: 2 → 1  |  Inverse engine: 2 → 1</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(190.1205 900.8586)">Total mod_mul seluruh hierarki: 8 → 4 (bukan hanya satu multiplier di seluruh chip).</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(155.331 918.2988)">RFC6979 / HMAC sejak awal berada pada signer; tidak dihitung sebagai duplikasi yang dihapus.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.08px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="52.56" y="972.98145" transform="rotate(-0 52.56 972.98145)">Panah menunjukkan jalur request / pemakaian. Hasil engine kembali melalui pemilah respons pada blok tengah.</text>
   </g>
  </g>
 </g>
