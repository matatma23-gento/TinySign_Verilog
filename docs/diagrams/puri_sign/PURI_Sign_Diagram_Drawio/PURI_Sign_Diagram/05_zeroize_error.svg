   <g id="text_1">
    <text style="font-weight: 700; font-size: 20.16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="39.16665" transform="rotate(-0 38.16 39.16665)">Kontrol | ZEROIZE, status, dan penolakan akses</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="75.7386" transform="rotate(-0 38.16 75.7386)">ZEROIZE adalah pengecualian saat busy; perintah harus ditulis dengan byte_enable = 0xF.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="1052.953088" transform="rotate(-0 38.16 1052.953088)">PURI-Sign | Berdasarkan RTL shared-engine, 8 Oktober 2026 | Diagram alur, bukan timing fisik</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(164.5551 132.8769)">HOST: CMD_ZEROIZE = 5</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(108.9927 150.4188)">Dapat dikirim saat idle maupun operasi aktif</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(163.9602 230.5386)">Core memicu key_zeroize</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(116.3025 247.8186)">Pindah ke ZEROIZE_WAIT → owner dilepas</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(119.2617 265.0986)">Hapus digest dan r/s core; sign_valid = 0</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(125.3241 342.2988)">Reset shared scalar / inverse / multiply</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(162.3906 359.5788)">Clear signer dan RFC6979</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(105.1911 376.8588)">Batalkan pekerjaan yang sedang berlangsung</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(115.1577 453.7386)">key_manager membersihkan staging, key,</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(146.3994 471.1788)">public key dan state sementara</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(107.9145 488.2986)">key_valid = 0; key_locked = 0; key_done = 1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(163.8099 565.3386)">Core menerima key_done</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(124.2648 582.6186)">done_latch = 1; busy = 0; zeroized = 1</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(199.7541 601.1748)">Kembali IDLE</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243746" x="237.6" y="681.7788" transform="rotate(-0 237.6 681.7788)">Host dapat melakukan provisioning baru</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(599.9121 140.2731)">BUS WRITE SAAT BUSY</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(547.605 156.3786)">Selain CMD_ZEROIZE → error_code 0x03.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(584.8569 173.8188)">Operasi aktif tetap berjalan;</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(549.5517 191.0988)">penolakan write tidak membatalkannya.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(598.3623 262.1448)">BYTE ENABLE / ALAMAT</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(563.9787 278.9388)">Write harus satu word penuh (0xF).</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(543.9582 296.2188)">Byte enable salah / alamat tidak didukung</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(610.5609 313.3386)">→ error_code 0x04.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(585.2088 384.6204)">ERROR PERINTAH / OPERASI</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(542.0727 401.3388)">0x01: command / prasyarat key tidak valid</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(556.7193 418.4586)">0x02: key_manager atau signer gagal</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(569.6244 435.8988)">Status error harus diperiksa host.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(563.3604 506.2986)">CMD_CLEAR_STATUS = 6 (saat idle)</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(549.0063 523.5786)">Hapus done/error/error_code, sign_valid,</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(562.3569 541.0188)">dan zeroized. Tidak menghapus key</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(581.0247 558.2988)">atau isi register signature r/s.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(613.9377 629.8731)">REGISTER STATUS</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(564.3468 645.9786)">ready, busy, done, error, key_valid,</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(574.3503 663.2586)">key_locked, sign_valid, zeroized</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(576.5607 680.6988)">Readback key selalu bernilai 0.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(327.4299 789.1533)">URUTAN PADA TRACE RTL @ 25 MHz</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(171.693 806.1786)">T0: perintah diterima, key_zeroize aktif, shared engine berhenti dan sign_valid core turun.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(298.7928 823.4586)">T0 + 1 siklus: key_valid dan key_locked turun.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(254.6505 840.8988)">T0 + 2 siklus: core menyelesaikan ZEROIZE dan kembali idle.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(384.9408 919.6731)">BATAS DIAGRAM</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(127.4499 935.9388)">Ini alur perilaku RTL yang tersedia, bukan klaim sertifikasi secure element atau ketahanan serangan fisik.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(140.355 953.2188)">Reset/clear logika tidak membuktikan waktu penghapusan fisik. Latensi di atas berasal dari simulasi.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(177.1056 970.4988)">Integrasi clock 25 MHz, pin board, dan host tetap mengikuti batas implementasi proyek.</text>
   </g>
  </g>
 </g>
 <defs>
