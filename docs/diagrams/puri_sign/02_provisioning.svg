   <g id="text_1">
    <text style="font-weight: 700; font-size: 20.16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="39.16665" transform="rotate(-0 38.16 39.16665)">Provisioning | Validasi, public key, dan lock</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="75.8988" transform="rotate(-0 38.16 75.8988)">Owner engine = PROVISION. Private key tidak tersedia pada jalur pembacaan register.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="38.16" y="1031.353088" transform="rotate(-0 38.16 1031.353088)">PURI-Sign | Berdasarkan RTL shared-engine, 8 Oktober 2026 | Diagram alur, bukan timing fisik</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(130.6215 130.6188)">Tulis 8 word private key ke staging</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(151.7823 147.7386)">Kemudian CMD_PROVISION</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(140.576063 236.080125)">Key belum valid, 8 word lengkap,</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(189.457031 253.326375)">dan 1 ≤ d &lt; n?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(181.6605 350.5131)">SHARED SCALAR</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(105.0669 366.7788)">Hitung Q = dG → koordinat Jacobian (X,Y,Z)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(179.6769 441.2331)">SHARED INVERSE</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(188.8569 457.4988)">u = Z⁻¹ mod p</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(123.3333 527.6988)">SHARED MULTIPLY, dipakai berurutan</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(137.1096 544.8771)">u² → u³ → Qx = X·u² → Qy = Y·u³</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(158.4693 562.2588)">Semua operasi modulo p</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(105.7338 635.5386)">Simpan d pada key_reg; simpan Qx dan Qy</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(99.6615 652.8186)">key_valid = 1; bersihkan staging / sementara</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(145.6218 670.7871)">Core: done = 1, kembali IDLE</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(179.5761 742.3569)">HOST: CMD_LOCK</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(152.1027 759.7386)">Key valid → key_locked = 1</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(155.9394 832.6188)">Kunci siap dipakai signing</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(145.5525 849.8988)">Readback private key tetap 0</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="214.56" y="305.540156" transform="rotate(-0 214.56 305.540156)">Ya</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(610.9254 227.0988)">Tolak provisioning</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(559.0881 244.2186)">key_error → core error_code = 0x02</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(541.3023 261.6588)">Tidak meneruskan perhitungan public key</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="423.36" y="233.706375" transform="rotate(-0 423.36 233.706375)">Tidak</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(552.3624 450.6588)">Jika salah satu engine mengirim error:</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(565.5645 469.0548)">hentikan urutan controller → IDLE</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(557.55 485.0586)">Core melaporkan error_code = 0x02</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(553.1481 502.4988)">Host memeriksa error sebelum lanjut.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(626.3892 635.5575)">ATURAN KEY</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(561.2706 651.7386)">Penulisan key ditolak jika key_valid</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(580.7034 669.0186)">atau key_locked sudah aktif.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(563.4405 686.4588)">LOCK memerlukan key yang valid.</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(538.8264 703.7388)">Penggantian key dimulai dengan ZEROIZE.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(641.1897 833.2731)">NOTASI</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(597.7701 849.5388)">p: modulus field P-256</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(594.8694 866.8188)">n: orde subgroup P-256</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(580.4352 884.0988)">G: base point; d: private key</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(291.5622 945.6588)">7.303.706 siklus core = 292,14824 ms pada 25 MHz</text>
    <text style="font-size: 11.52px; font-family: 'DejaVu Sans'; fill: #243746" transform="translate(183.456 962.7786)">Angka berasal dari trace simulasi; tidak mencakup penulisan 8 word key atau CMD_LOCK.</text>
   </g>
  </g>
 </g>
